apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-test
  namespace: wi-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kv-test
  template:
    metadata:
      labels:
        app: kv-test
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: kv-reader
      containers:
      - name: azcli
        image: mcr.microsoft.com/azure-cli
        command: ["sleep", "infinity"]