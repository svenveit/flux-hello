apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: web
spec:
  gatewayClassName: approuting-istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: web.lab.local
  - name: https
    port: 443
    protocol: HTTPS
    hostname: web.lab.local
    tls:
      mode: Terminate
      certificateRefs:
      - name: web-tls